<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LiPDverse</title>
<link rel="icon" href="/dev/site/img/favicon.ico">
<link rel="apple-touch-icon" href="/dev/site/img/apple-touch-icon.png">
<style>
  :root {
    --bg: #ffffff; --fg: #2b2b2b; --muted: #6b7780; --line: #dfe4e8;
    --accent: #38a7bb; --chip: #eef4f6; --warn: #b45309;
    --brandbar: #1d2b30; --ocean: #dceaf0; --land: #f2f0ea; --border: #8fa3ac;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #10171a; --fg: #e6edf3; --muted: #93a7b1; --line: #24313a;
            --accent: #4cc3d9; --chip: #18232a; --warn: #e3a008;
            --brandbar: #0b1215; --ocean: #0e1b22; --land: #33454e; --border: #7c94a0; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg);
         font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  header { background: var(--brandbar); padding: 11px 20px; display: flex;
           gap: 16px; align-items: center; flex-wrap: wrap; }
  header img.logo { height: 30px; width: auto; display: block; }
  header a.brand { display: flex; align-items: center; text-decoration: none; }
  .scope { color: #b9c6cc; font-size: 14px; border-left: 1px solid #3a4a51;
           padding-left: 16px; }
  main { padding: 18px 20px 60px; max-width: 1400px; }
  .controls { display: flex; gap: 14px; flex-wrap: wrap; align-items: center; margin-bottom: 14px; }
  /* The search box and Advanced are one control; the archive chips are a
     separate, lighter thing. Keeping them visually distinct stops Advanced
     reading as just another archive type. */
  .searchgroup { display: flex; gap: 8px; align-items: center; }
  .chipset { display: flex; gap: 7px; flex-wrap: wrap; align-items: center;
             padding-left: 14px; border-left: 1px solid var(--line); }
  input[type=search] { padding: 8px 11px; border: 1px solid var(--line); border-radius: 7px;
                       background: var(--bg); color: var(--fg); min-width: 280px; font-size: 14px; }
  .chip { border: 1px solid var(--line); background: var(--chip); color: var(--fg);
          border-radius: 999px; padding: 4px 11px; font-size: 13px; cursor: pointer; }
  .chip[aria-pressed=true] { background: var(--accent); border-color: var(--accent); color: #fff; }
  .count { color: var(--muted); font-size: 13px; }
  .hidden { display: none !important; }
  .small { font-size: 12px; }
  .adv { border: 1px solid var(--line); border-radius: 9px; padding: 14px;
         margin-bottom: 16px; background: color-mix(in srgb, var(--chip) 55%, transparent); }
  .facetgrid { display: grid; gap: 14px 20px;
               grid-template-columns: repeat(auto-fill, minmax(215px, 1fr)); }
  .facetgrid.ranges { margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--line);
                      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); }
  .facethead { font-size: 12.5px; font-weight: 600; text-transform: uppercase;
               letter-spacing: 0.04em; color: var(--muted); margin-bottom: 5px; }
  .facetlist { max-height: 190px; overflow-y: auto; padding-right: 4px; }
  .facetopt { display: flex; align-items: baseline; gap: 6px; font-size: 13.5px;
              padding: 1px 0; cursor: pointer; }
  .facetopt:hover { color: var(--accent); }
  .facetval { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .facetn { font-variant-numeric: tabular-nums; font-size: 12px; }
  .facetfilter { width: 100%; padding: 3px 7px; margin-bottom: 5px; font-size: 12.5px;
                 border: 1px solid var(--line); border-radius: 5px;
                 background: var(--bg); color: var(--fg); }
  .rangerow { display: flex; align-items: center; gap: 7px; }
  input.yr { width: 92px; padding: 4px 7px; font-size: 13px; border: 1px solid var(--line);
             border-radius: 5px; background: var(--bg); color: var(--fg); }
  /* Deliberately not a chip: square-ish, accent-outlined, and it fills in when
     the panel is open, so it reads as a mode rather than a value. */
  .advbtn { cursor: pointer; border-radius: 7px; border: 1px solid var(--accent);
            background: transparent; color: var(--accent); font-weight: 600;
            padding: 7px 13px; font-size: 13.5px; }
  .advbtn:hover { background: color-mix(in srgb, var(--accent) 12%, transparent); }
  .advbtn[aria-expanded="true"] { background: var(--accent); color: #fff; }
  .clearbtn { cursor: pointer; border-radius: 7px; padding: 6px 12px; font-size: 13px; }
  .mapwrap { position: relative; max-width: 1000px; margin-bottom: 16px; }
  #map { width: 100%; border: 1px solid var(--line); border-radius: 8px;
         display: block; touch-action: none; cursor: grab; --k: 1; }
  #map.grabbing { cursor: grabbing; }
  #map .ocean { fill: var(--ocean); }
  #map .land path { fill: var(--land); stroke: var(--border);
                    stroke-width: 0.7px; vector-effect: non-scaling-stroke; }
  #map .land path:hover { fill: color-mix(in srgb, var(--land) 82%, var(--accent)); }
  #map .graticule { stroke: var(--border); fill: none; stroke-width: 0.5px;
                    stroke-opacity: 0.45; vector-effect: non-scaling-stroke; }
  #map .points circle { fill: var(--accent); fill-opacity: 0.75;
                        stroke: #fff; stroke-opacity: 0.55;
                        r: calc(2.6px * var(--k)); stroke-width: calc(0.6px * var(--k)); }
  #map .points circle:hover { fill-opacity: 1; r: calc(4.2px * var(--k)); }
  .maphint { position: absolute; left: 10px; bottom: 8px; font-size: 11.5px;
             color: var(--muted); background: color-mix(in srgb, var(--bg) 78%, transparent);
             padding: 2px 7px; border-radius: 5px; pointer-events: none; }
  .mapreset { position: absolute; right: 10px; top: 10px; }
  table { border-collapse: collapse; width: 100%; font-size: 14px; }
  th, td { text-align: left; padding: 6px 10px; border-bottom: 1px solid var(--line);
           white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 380px; }
  th { color: var(--muted); font-weight: 600; font-size: 12.5px; text-transform: uppercase;
       letter-spacing: 0.04em; cursor: pointer; user-select: none; position: sticky; top: 0;
       background: var(--bg); }
  tbody tr:hover { background: var(--chip); }
  a { color: var(--accent); }
  .num { text-align: right; font-variant-numeric: tabular-nums; }
  .muted { color: var(--muted); }
  .warn { color: var(--warn); }
  dl.meta { display: grid; grid-template-columns: max-content 1fr; gap: 6px 18px; margin: 0 0 20px; }
  dl.meta dt { color: var(--muted); font-size: 13px; }
  dl.meta dd { margin: 0; }
  footer { border-top: 1px solid var(--line); margin-top: 30px; padding: 14px 20px;
           color: var(--muted); font-size: 12.5px; }
  footer code { font-size: 12px; }
  .loading { color: var(--muted); padding: 30px 0; }
  .h2 { font-size: 15px; margin: 22px 0 8px; }
  .hint { font-size: 13px; margin: 0 0 8px; }
  ol.pubs { margin: 0 0 18px; padding-left: 20px; }
  ol.pubs li { margin-bottom: 11px; line-height: 1.55; }
  .cite { }
  .cite em { font-style: italic; }
  .copycite { margin-left: 8px; padding: 0 8px; font-size: 11.5px; cursor: pointer;
              vertical-align: 1px; }
  .morecol { width: 54px; text-align: right; }
  .more-btn { padding: 1px 9px; font-size: 12px; cursor: pointer; }
  tr.detailrow > td { background: var(--chip); padding: 12px 14px; white-space: normal; }
  .coldetail dl.detail { grid-template-columns: max-content 1fr; margin-bottom: 10px; }
  .coldetail h4 { font-size: 13px; margin: 10px 0 5px; }
  table.interp { font-size: 13px; background: var(--bg); border-radius: 6px; }
  table.interp th, table.interp td { padding: 4px 8px; }
  /* Stacked by default: metadata, then map, then publications. */
  .dstop { display: grid; gap: 8px 24px; align-items: start; margin-bottom: 4px; }
  .dstop .dsmeta { grid-area: meta; }
  .dstop .dsmap  { grid-area: map; }
  .dstop .dspubs { grid-area: pubs; }
  .dstop { grid-template-areas: "meta" "map" "pubs"; }
  @media (min-width: 900px) {
    /* Wide: map to the right of both, spanning them. */
    .dstop { grid-template-columns: minmax(0, 1fr) minmax(330px, 46%);
             grid-template-areas: "meta map" "pubs map"; }
    .dstop .dsmap { align-self: start; position: sticky; top: 14px; }
  }
  .dstop .mapwrap { margin-bottom: 8px; }
  .h2.tight { margin-top: 6px; }
  .downloads { display: flex; gap: 10px; align-items: center; flex-wrap: wrap;
               margin: 10px 0 16px; }
  a.dlbtn { display: inline-block; text-decoration: none; font-weight: 600;
            font-size: 13.5px; padding: 8px 14px; border-radius: 7px;
            background: var(--accent); color: #fff; border: 1px solid var(--accent); }
  a.dlbtn:hover { filter: brightness(1.08); }
  a.dlbtn.secondary { background: transparent; color: var(--accent); }
  a.dlbtn.secondary:hover { background: color-mix(in srgb, var(--accent) 12%, transparent); }
  .dlsize { font-weight: 400; opacity: 0.85; }
  .backbar { display: flex; gap: 10px; align-items: center; flex-wrap: wrap;
             margin: 0 0 12px; font-size: 13.5px; }
  a.back { text-decoration: none; font-weight: 550; }
  a.back:hover { text-decoration: underline; }
  #map .points circle.here { fill: var(--warn); fill-opacity: 1;
                             stroke: var(--bg); stroke-opacity: 1;
                             r: calc(5px * var(--k)); stroke-width: calc(1.4px * var(--k)); }
  table.ts tbody tr.clickable { cursor: pointer; }
  table.ts tbody tr.noplot td { color: var(--muted); }
  table.ts tbody tr.on { background: color-mix(in srgb, var(--accent) 13%, transparent); }
  table.ts tbody tr.on td { font-weight: 550; }
  .togglecol { width: 26px; padding-right: 0 !important; }
  .box { display: inline-block; width: 15px; height: 15px; line-height: 14px;
         text-align: center; border: 1px solid var(--border); border-radius: 4px;
         font-size: 11px; color: var(--accent); background: var(--bg); }
  tr.on .box { background: var(--accent); border-color: var(--accent); color: #fff; }
  tr.noplot .box { border-style: dashed; color: var(--muted); }
  .chartsec h3 .closechart { float: right; padding: 1px 8px; font-size: 13px;
                             line-height: 1.4; cursor: pointer; }
  .chartsec h3 { font-size: 14px; font-weight: 600; margin: 16px 0 4px; }
  .chartwrap { margin: 0 0 8px; max-width: 900px; }
  .chartwrap figcaption { font-size: 12px; margin-top: 2px; }
  svg.chart { width: 100%; height: auto; display: block;
              border: 1px solid var(--line); border-radius: 8px; background: var(--bg); }
  svg.chart .grid { stroke: var(--line); stroke-width: 1; }
  svg.chart .axis { stroke: var(--muted); stroke-width: 1; }
  svg.chart .series { fill: none; stroke: var(--accent); stroke-width: 1.4;
                      stroke-linejoin: round; stroke-linecap: round; }
  svg.chart .dot { fill: var(--accent); fill-opacity: 0.75; }
  svg.chart .tick, svg.chart .axlabel { fill: var(--muted); font-size: 11px;
                                        font-family: inherit; }
  .more { margin-top: 12px; }
  button.more { padding: 7px 14px; border-radius: 7px; border: 1px solid var(--line);
                background: var(--chip); color: var(--fg); cursor: pointer; font-size: 14px; }
</style>
</head>
<body>
<header>
  <a class="brand" href="/dev/lipdverse/"><img class="logo" src="/dev/site/img/lipdverse_logo_text.png" alt="LiPDverse"></a>
  <span class="scope" id="scope"></span>
</header>
<main id="main"><p class="loading">Loading…</p></main>
<footer id="footer"></footer>
<!-- Absolute, not relative. The app is served at virtual URLs like
     /dev/hydroclimate2k/0_6_3/, so "./app.js" resolves against the document
     URL, misses, and the catch-all rule hands back index.html as text/html --
     which the browser silently refuses to execute as a module. The page then
     sits on "Loading..." forever with nothing in the console to explain it. -->
<script type="module" src="/dev/site/app.js"></script>
<script>
  // A module that fails to load fires no error the user can see. Say so.
  setTimeout(function () {
    var m = document.getElementById('main')
    if (m && m.textContent.trim() === 'Loading\u2026') {
      m.innerHTML = '<p class="warn">The application did not start.</p>' +
        '<p class="muted">The page loaded but its script did not run. ' +
        'Check the browser console, and see /dev/export/current.json.</p>'
    }
  }, 15000)
</script>
</body>
</html>
