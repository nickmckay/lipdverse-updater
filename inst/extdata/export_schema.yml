# Canonical export schema.
#
# This is a contract, not documentation. The site generator reads these files and
# nothing else, so a column removed or retyped here breaks a downstream repo that
# cannot be edited in the same commit. Tests assert every table against this
# file, so changing the shape means changing this file deliberately.
#
# Adding an optional column is compatible. Removing one, renaming one, or
# changing a type is not, and needs the version below bumped.
#
# v2 splits the ensembles out of `values`. Measured across the whole database,
# ensembles are 88.9% of all 437 million value rows and the most expensive per
# row (8.82 bytes against 3.93), so a combined table is ~3.6 GB while the part
# nearly every consumer reads is ~189 MB. Keeping them together meant either
# duplicating 3.6 GB into each of 19 compilation directories, or not shipping a
# self-contained export at all.
version: 2

# Types are the R types the builder produces; the parquet writer maps them.
#   chr = character, dbl = double, int = integer, lgl = logical, ts = POSIXct
tables:

  datasets:
    key: [datasetId]
    description: One row per dataset.
    columns:
      datasetId:        {type: chr, required: true}
      dataSetName:      {type: chr, required: true}
      archiveType:      {type: chr}
      version:          {type: chr}
      geo_latitude:     {type: dbl}
      geo_longitude:    {type: dbl}
      geo_elevation:    {type: dbl}
      geo_siteName:     {type: chr}
      minYear:          {type: dbl}
      maxYear:          {type: dbl}
      hasChron:         {type: lgl}
      hasChronEnsemble: {type: lgl}
      hasPaleoEnsemble: {type: lgl}
      n_timeseries:     {type: int}
      file_md5:         {type: chr}

  timeseries:
    key: [TSid]
    description: One row per column that carries a TSid.
    columns:
      TSid:              {type: chr, required: true}
      datasetId:         {type: chr, required: true}
      tableType:         {type: chr, required: true}   # paleo | chron
      tableKind:         {type: chr}                   # measurement | summary | ensemble | distribution
      variableName:      {type: chr}
      standardName:      {type: chr}
      units:             {type: chr}
      proxy:             {type: chr}
      proxyGeneral:      {type: chr}
      description:       {type: chr}
      primaryTimeseries: {type: lgl}
      isAxis:            {type: lgl}                   # year/age/depth and friends
      createdBy:         {type: chr}
      minYear:           {type: dbl}
      maxYear:           {type: dbl}
      medianResolution:  {type: dbl}
      n_values:          {type: int}
      # An ensemble column arrives as a matrix and is flattened into
      # values_ensemble, which loses its shape. These record it, so row_index is
      # decomposable: the flattening is column major, so member m occupies
      # row_index ((m - 1) * n_rows + 1) to (m * n_rows). NA for anything that
      # was not a matrix.
      n_rows:            {type: int}
      n_members:         {type: int}

  values:
    key: [TSid, row_index]
    description: >
      Measurement and summary values: everything except the ensembles. 11% of
      the rows and what nearly every consumer actually reads.

      Long, deliberately. A wide table forces one type per row across every
      column, which is how a string or logical column becomes NaN on the way
      through a numeric matrix. Splitting into value_num and value_chr makes
      that coercion impossible to express.
    columns:
      TSid:      {type: chr, required: true}
      row_index: {type: int, required: true}
      value_num: {type: dbl}
      value_chr: {type: chr}

  values_ensemble:
    key: [TSid, row_index]
    partition_by: datasetId
    external: true
    description: >
      Ensemble and distribution values, the same shape as `values`. Written
      once, globally, Hive-partitioned by datasetId, and referenced by a
      compilation's manifest rather than copied into it: 815 of 7,268 datasets
      have ensembles at all, and they account for 3.43 GB of the 3.6 GB total.

      Carries datasetId, which `values` does not, because it is the partition
      key and a reader needs it before opening anything.

      An ensemble is stored flat, one row per value, ordered column major: for a
      column with `timeseries.n_rows` positions and `timeseries.n_members`
      members, member m occupies row_index ((m - 1) * n_rows + 1) to
      (m * n_rows). Those two columns are the only record of the shape, since a
      single-column ensemble table has no sibling to infer it from.
    columns:
      datasetId: {type: chr, required: true}
      TSid:      {type: chr, required: true}
      row_index: {type: int, required: true}
      value_num: {type: dbl}
      value_chr: {type: chr}

  interpretations:
    key: [TSid, scope, rank]
    description: >
      One row per interpretation, numbered within its scope. An interpretation
      with no scope is labelled "unscoped" rather than left null, because scope
      is part of the key and SQL joins do not match on null.
    columns:
      TSid:            {type: chr, required: true}
      scope:           {type: chr, required: true}   # climate | environment | isotope | unscoped
      rank:            {type: int, required: true}
      variable:        {type: chr}
      variableDetail:  {type: chr}
      direction:       {type: chr}
      seasonality:     {type: chr}
      basis:           {type: chr}
      isAnnual:        {type: lgl}

  publications:
    key: [datasetId, pubIndex]
    description: Authors stay a list rather than a joined string.
    columns:
      datasetId: {type: chr, required: true}
      pubIndex:  {type: int, required: true}
      pubKind:   {type: chr}
      authors:   {type: list_chr}
      year:      {type: int}
      title:     {type: chr}
      journal:   {type: chr}
      doi:       {type: chr}
      citeKey:   {type: chr}   # as the LiPD file records it, often absent
      # Filled from the reference database in the store: the citekey the legacy
      # bibliography has used for years, so a reference keeps one identity
      # across the old site and the new. ref_source says which tier answered --
      # crossref, curated, or absent for a record the files alone describe.
      citekey:    {type: chr}
      ref_source: {type: chr}

  compilations:
    key: [datasetId, compilation, TSid]
    description: Exploded compilation membership, one row per timeseries per compilation.
    columns:
      datasetId:          {type: chr, required: true}
      TSid:               {type: chr, required: true}
      compilation:        {type: chr, required: true}
      compilationVersion: {type: chr}
      inThisCompilation:  {type: lgl}

  # --- context tables -------------------------------------------------------
  # Not derived from the LiPD files but from the store, the registry and the
  # version ledger. They are what makes an export interpretable on its own:
  # what changed, what the curators decided, and which vocabulary was in force.

  changelog:
    key: [datasetId, version, seq]
    description: >
      Per-dataset version history, flattened from each file's changelog. Carries
      compilation and run_id so a change can be attributed to the run that made
      it, which is what a cross-compilation overwrite otherwise hides.
    columns:
      datasetId:   {type: chr, required: true}
      version:     {type: chr, required: true}
      seq:         {type: int, required: true}
      lastVersion: {type: chr}
      curator:     {type: chr}
      timestamp:   {type: chr}
      compilation: {type: chr}
      run_id:      {type: chr}
      n_changes:   {type: int}

  qc_state:
    key: [tsid, field]
    description: >
      The curated state as the store holds it, for the compilation being
      exported. Present is carried explicitly: absent is not the same as blank,
      and collapsing them is the loss this project exists to prevent.
    columns:
      tsid:       {type: chr, required: true}
      field:      {type: chr, required: true}
      value:      {type: chr}
      present:    {type: lgl, required: true}
      dataset_id: {type: chr}
      updated_at: {type: chr}
      source:     {type: chr}
      actor:      {type: chr}

  versions:
    key: [compilation, version]
    description: The version ledger, so a published figure can name what it used.
    columns:
      compilation: {type: chr, required: true}
      version:     {type: chr, required: true}
      created_at:  {type: chr}
      run_id:      {type: chr}
      n_datasets:  {type: int}
      notes:       {type: chr}

  compilation_versions:
    key: [compilation, version, dataset]
    description: >
      What a compilation contained at each published version, and at which
      version of each dataset. This is what a compilation page for a published
      version is built from: the pages themselves live at
      /data/<datasetId>/<version>, and a shell for hydroclimate2k 0_5_0 has to
      name exactly the datasets and dataset versions that release contained.

      `compilations` cannot answer this. It records which compilation versions a
      timeseries has belonged to, taken from the files as they are now, so it
      describes the present rather than any past release.

      datasetId and datasetVersion are NA for versions published before the
      ledger recorded them, and always will be: that detail was not written down
      and cannot be reconstructed afterwards.
    columns:
      compilation:    {type: chr, required: true}
      version:        {type: chr, required: true}
      dataset:        {type: chr, required: true}
      datasetId:      {type: chr}
      datasetVersion: {type: chr}

  vocab:
    key: [field, lipdName, synonym]
    description: >
      The controlled vocabulary in force at export time, overlay included, so a
      value can be checked against what was current then rather than what is
      current now.
    columns:
      field:    {type: chr, required: true}
      lipdName: {type: chr, required: true}
      synonym:  {type: chr, required: true}

manifest:
  file: export_manifest.json
  fields:
    - schema_version
    - compilation
    - version
    - generated_at
    - generator_version      # lipdverseUpdater
    - lipdr_version
    - db_fingerprint
    - vocab_pin
    - qc_state_hash
    - run_id
    - files                  # name, n_rows, sha256, bytes
