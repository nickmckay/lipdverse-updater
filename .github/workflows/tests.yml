name: tests

# The unit suite only. The replay corpus and the LiPD database live on Nick's
# machine, not in CI, so scripts/check-replay-profile.R is a nightly check there
# rather than a job here -- it takes about a quarter of an hour over 178
# recorded version-runs.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          # lipdR comes from the Remotes: pin in DESCRIPTION, not from here.
          # Naming it here installed whatever main happened to be -- 0.6.0,
          # whose validLipd rejects the fixtures the package writes -- while
          # every developer had 0.7.0 from dev. Sixteen tests failed in CI and
          # passed everywhere else.
          extra-packages: |
            any::devtools
            any::testthat
          needs: check

      - name: Run tests
        run: Rscript -e 'devtools::test(stop_on_failure = TRUE)'

      - name: The registry must be regenerable from its review files
        run: Rscript scripts/check-registry-regenerable.R
